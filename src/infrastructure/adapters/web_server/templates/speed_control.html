<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >
  <title>Controle de Velocidade</title>
  <style>
    :root {
      color-scheme: light;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Inter", Arial, sans-serif;
      background: linear-gradient(160deg, #f7f9fc 0%, #eef2f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      width: min(480px, 100%);
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 1.2rem + 1vw, 1.9rem);
      color: #0f172a;
      text-align: center;
      letter-spacing: -0.01em;
    }

    header p {
      margin: 8px 0 0;
      font-size: clamp(0.95rem, 0.85rem + 0.3vw, 1.05rem);
      color: #475569;
      text-align: center;
      line-height: 1.5;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      font-size: clamp(1rem, 0.95rem + 0.3vw, 1.1rem);
      font-weight: 600;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .value {
      font-size: clamp(1rem, 0.95rem + 0.2vw, 1.1rem);
      font-weight: 700;
      color: #0f172a;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.08);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.45);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #2563eb;
      border: 4px solid #eff6ff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      cursor: pointer;
      transition: transform 150ms ease;
    }

    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.08);
    }

    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #2563eb;
      border: 4px solid #eff6ff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      cursor: pointer;
      transition: transform 150ms ease;
    }

    input[type="range"]::-moz-range-thumb:active {
      transform: scale(1.08);
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #f8fafc;
      font-size: clamp(1rem, 0.95rem + 0.2vw, 1.05rem);
      font-weight: 600;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      color: #64748b;
      line-height: 1.4;
    }

    footer strong {
      color: #1d4ed8;
    }

    @media (min-width: 640px) {
      body {
        padding: 48px;
      }

      main {
        padding: 40px 36px;
        gap: 28px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Controle de Velocidade</h1>
      <p>Ajuste a intensidade desejada e confirme para enviar ao veículo.</p>
    </header>
    <section class="slider-group">
      <label for="speedSlider">
        Nível atual
        <span class="value"><span id="speedValue">0</span>/255</span>
      </label>
      <input id="speedSlider" type="range" min="0" max="255" value="0" step="1">
    </section>
    <button type="button" onclick="sendSpeed()">Enviar velocidade</button>
    <footer>
      <strong>Dica:</strong> utilize toques suaves, sem necessidade de zoom, mesmo em telas menores.
    </footer>
  </main>

  <script>
    const slider = document.getElementById("speedSlider");
    const valueDisplay = document.getElementById("speedValue");
    const MAX_SPEED = 255;

    const updateDisplay = (value) => {
      valueDisplay.textContent = value;
    };

    slider.oninput = () => {
      updateDisplay(slider.value);
    };

    async function syncSpeedFromCar() {
      try {
        const response = await fetch("/api/car-info");
        if (!response.ok) return;

        const data = await response.json();
        const carSpeed = data?.car_info?.CAR_SPEED_DATA;

        if (typeof carSpeed === "number" && !Number.isNaN(carSpeed)) {
          const clamped = Math.max(0, Math.min(Math.round(carSpeed), MAX_SPEED));
          slider.value = clamped;
          updateDisplay(clamped);
        }
      } catch (error) {
        console.warn("Não foi possível sincronizar a velocidade:", error);
      }
    }

    function sendSpeed() {
      const speed = parseInt(slider.value, 10);
      fetch("/api/set-speed", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ speed })
      })
      .then(response => response.json())
      .then(data => {
        if (data.message) {
          alert(data.message);
          syncSpeedFromCar();
        } else if (data.error) {
          alert(data.error);
        }
      })
      .catch(err => alert("Erro ao enviar velocidade: " + err));
    }

    syncSpeedFromCar();
  </script>
</body>
</html>
